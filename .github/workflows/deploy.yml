name: Deploy to Hostinger

# Builds the React app and deploys the compiled site + PHP API to Hostinger
# (public_html) over FTP on every push to main.
#
# One-time setup in GitHub → repo Settings → Secrets and variables → Actions:
#   FTP_SERVER    e.g. ftp://ftp.your-domain.com   (or the host shown in hPanel)
#   FTP_USERNAME  your Hostinger FTP account username
#   FTP_PASSWORD  your Hostinger FTP account password
#
# Notes:
# - `.env` (committed) sets REACT_APP_API_BASE=/api, so the app calls the PHP
#   API on the same domain. No env vars are needed here.
# - The PHP `api/` folder is uploaded as-is; Hostinger's Apache runs it.
# - `thecopystudio_data/` (secrets + live content) is NOT in the repo and is
#   auto-created by the API outside public_html on first request.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build React app
        run: yarn build

      - name: Stage deployment (build output + PHP API)
        run: |
          mkdir -p deploy
          cp -r build/* deploy/
          # copy hidden files from build (e.g. .htaccess) too
          if compgen -G "build/.*" > /dev/null; then
            cp -r build/.[!.]* deploy/ 2>/dev/null || true
          fi
          cp -r api deploy/api

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # The folder Hostinger serves your domain from. Usually public_html/.
          # If your FTP account already lands inside public_html, change to ./
          server-dir: public_html/
          local-dir: ./deploy/
          # Never upload dev/CI cruft.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
