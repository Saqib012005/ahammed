; Dev-only PHP config for running the content API locally with the built-in server.
; Extension directory of the winget-installed PHP 8.3 build.
extension_dir = "C:\Users\sb496\AppData\Local\Microsoft\WinGet\Packages\PHP.PHP.8.3_Microsoft.Winget.Source_8wekyb3d8bbwe\ext"

; Extensions the API can use (uploads / transliteration / general robustness).
extension=mbstring
